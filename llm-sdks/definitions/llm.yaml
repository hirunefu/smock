# The Definition file of the SDK job (llm-sdks/README.md). llm-sdks/check.py
# calls each Stub through an official SDK, as applications call the API, and
# checks what the SDK reads against what the Stub declares. Each Stub
# answers one model, so the script picks a Stub by the model it asks for.
mocks:
  - name: openai
stubs:
  # Chat Completions: text only, with every id generated. In pieces of 4
  # code points, the text is "Hi! ", "こんにち", "は。 👋", "🏽 Ho" and so
  # on: one ends inside a Japanese word, and one between the two code
  # points of the emoji.
  - id: chat-text
    mock: openai
    request:
      method: POST
      path: /v1/chat/completions
      body: { json: { model: chat-text } }
    response:
      status: 200
      llm:
        api: openai-chat
        text: "Hi! こんにちは。 👋🏽 How can I help?"
        usage: { input: 19, output: 10 }

  # Chat Completions: text and two tool calls, with every id fixed, so
  # that the reply the stream helper builds can equal the JSON reply,
  # ids included. The arguments nest an object and hold CJK text and a
  # number.
  - id: chat-tools
    mock: openai
    request:
      method: POST
      path: /v1/chat/completions
      body: { json: { model: chat-tools } }
    response:
      status: 200
      headers: { x-request-id: req_sdk_chat_tools }
      llm:
        api: openai-chat
        id: chatcmpl-sdk-chat-tools
        model: chat-tools-2026-10-23
        text: Let me check both.
        toolCalls:
          - name: get_weather
            id: call_sdk_weather
            arguments: { city: 東京, days: 3, units: { temperature: celsius } }
          - name: get_time
            id: call_sdk_time
            arguments: { timezone: Asia/Tokyo }
        usage: { input: 52, output: 31 }

  # Chat Completions: one tool call and no text, so that content is null,
  # with every id generated.
  - id: chat-call-only
    mock: openai
    request:
      method: POST
      path: /v1/chat/completions
      body: { json: { model: chat-call-only } }
    response:
      status: 200
      llm:
        api: openai-chat
        toolCalls:
          - name: get_weather
            arguments: { city: Paris }
        usage: { input: 40, output: 12 }

  # Chat Completions: a reply cut at the token limit, with a written stop
  # reason.
  - id: chat-length
    mock: openai
    request:
      method: POST
      path: /v1/chat/completions
      body: { json: { model: chat-length } }
    response:
      status: 200
      llm:
        api: openai-chat
        text: The weather in Paris is
        usage: { input: 31, output: 5 }
        stopReason: length

  # Responses: text only, with every id generated. The text is chat-text's,
  # cut the same way.
  - id: responses-text
    mock: openai
    request:
      method: POST
      path: /v1/responses
      body: { json: { model: responses-text } }
    response:
      status: 200
      llm:
        api: openai-responses
        text: "Hi! こんにちは。 👋🏽 How can I help?"
        usage: { input: 37, output: 11 }

  # Responses: text and two tool calls, with the id, the model, the call
  # ids and the request id fixed. The message item's msg_ id and each
  # function call item's fc_ id are always generated. The arguments hold an
  # array, a boolean, a null and CJK text.
  - id: responses-tools
    mock: openai
    request:
      method: POST
      path: /v1/responses
      body: { json: { model: responses-tools } }
    response:
      status: 200
      headers: { x-request-id: req_sdk_responses_tools }
      llm:
        api: openai-responses
        id: resp_sdk_responses_tools
        model: responses-tools-2026-10-23
        text: Let me look both up.
        toolCalls:
          - name: get_forecast
            id: call_sdk_forecast
            arguments: { cities: [Paris, 東京], days: 2, hourly: false }
          - name: get_alerts
            id: call_sdk_alerts
            arguments: { region: 関東, severity: null }
        usage: { input: 64, output: 29 }
