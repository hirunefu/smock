# Builds and tests with the latest stable MoonBit every week, so that upstream
# breaking changes show up early (ADR 0001). A failure opens an issue, or
# comments on the one already open. Run it by hand from the Actions tab to try it.
name: Latest MoonBit

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (latest MoonBit)
    uses: ./.github/workflows/build-test.yml
    with:
      toolchain: latest

  report-failure:
    name: Report the failure
    needs: build-test
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the issue
        run: |
          title="Build fails with the latest MoonBit toolchain"
          body="The build and tests failed with the latest stable MoonBit toolchain: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
