# Builds and tests every module. ci.yml runs it with the pinned toolchain on
# each push to a branch and each pull request; latest-toolchain.yml runs it
# weekly with the latest stable MoonBit.
#
# A check runs on both architectures only where it runs native code built for
# that architecture; a check that reads text, or runs only the front end of
# the compiler, runs once (the job checks). The debug tests, the engine's
# tests in a release build and the release binary are three compiles that
# share no output, so each architecture has a job for each (test,
# release-test, release) and they run side by side.
#
# With the pinned toolchain, the job release hands over the release binary
# of each architecture as a workflow artifact, release-linux-amd64 and
# release-linux-arm64. The SDK job reads the amd64 binary's LLM responses
# with the official SDKs, and ci.yml keeps both for 7 days as
# smock-linux-amd64 and smock-linux-arm64 once every job of its run passed.
#
# On a push to main that merges a branch whose tests already passed on the
# same tree, the job plan skips checks, test and release-test
# (scripts/ci-plan.sh). The release jobs, the conformance suite and the SDK
# job run in every run, so main's binaries are built and checked from
# main's commit, and ci.yml keeps them once every job has passed.
#
# scripts/check-ci-artifacts.sh checks the conditions under which the jobs
# here run and the binaries are handed over and kept.
name: Build and test

on:
  workflow_call:
    inputs:
      toolchain:
        description: "pinned (the version in .moonbit-version) or latest (the latest stable MoonBit)"
        type: string
        default: pinned

permissions:
  contents: read

jobs:
  # Runs only for a push to main, and decides whether the tests may be
  # skipped: the push is a merge, its tree equals the merged branch head's,
  # and a push run of that head, on a branch other than main, passed in the
  # last 24 hours. The tree holds the workflows and scripts too, so an
  # equal tree was tested the same way.
  # Everywhere else this job is skipped and every job runs. The jobs that
  # need it read "anything but false" as "run": a plan that fails, or that
  # says nothing, skips nothing.
  plan:
    name: Plan (on main, tests of a tree that already passed are skipped)
    if: inputs.toolchain == 'pinned' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read # scripts/ci-plan.sh looks up the merged branch's run
    outputs:
      full: ${{ steps.plan.outputs.full }}
    steps:
      # The commit and its parents: a merge's second parent is the merged
      # branch head.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: plan
        name: Decide whether the tests run
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-plan.sh >>"$GITHUB_OUTPUT"

  # What does not depend on the machine: the checks of the sources and of
  # the modules the build resolves, which run the compiler's front end at
  # most, and the tests on wasm-gc.
  checks:
    name: checks and wasm-gc tests
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.full != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The whole history, so that the site-count check below finds the
      # merge base with main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install MoonBit (${{ inputs.toolchain }})
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: scripts/install-moonbit.sh "$TOOLCHAIN"

      - name: Update the mooncakes registry index
        run: moon update

      - run: moon version --all

      # moon takes the version moon.mod gives an import as a minimum, so a
      # module that needs a later moonhttp would raise it. This fails on any
      # difference, which is what pins moonhttp exactly (ADR 0005).
      - name: Check that the build resolves the moonhttp that moon.mod names
        run: scripts/check-moonhttp-pin.sh

      - name: Check formatting
        if: inputs.toolchain == 'pinned'
        run: moon fmt --check

      - name: Check every target
        run: moon check --deny-warn --target all

      - name: Check that the protocol modules and the packages that decide a response do no I/O
        run: scripts/check-no-io.sh

      # It also scans the modules the build resolves outside moonbitlang,
      # which moon check downloaded: moonhttp and the modules it imports, so
      # that an upgrade brings no C (ADR 0005).
      - name: Check the C boundary (ADR 0001), in smock and in its resolved modules
        run: scripts/check-no-c.sh

      # NOTICE names every module the build resolves, of any owner and
      # transitive ones included, at the version the build resolves, and
      # says which of them smock compiles nothing from (ADR 0005). The
      # release workflow runs the same check.
      - name: Check that NOTICE names the toolchain and every module the build resolves
        run: scripts/check-notice.sh

      - name: Test the moonhttp pin check, the C check of the resolved modules and the NOTICE check
        run: scripts/test-dependency-checks.sh

      # moon skips every package whose supported_targets leave out wasm-gc,
      # which is how packages that do I/O are marked. Every other package,
      # including each new no-I/O package, is tested here with no change.
      # scripts/check-no-io.sh keeps the packages that decide a response
      # from leaving wasm-gc out.
      - name: Test every no-I/O package on wasm-gc
        run: moon test --target wasm-gc

      # The mutation runner and its site finder (scripts/mutation/), on a
      # fixture module whose sites and outcomes are known. They need moon
      # and moonc, so they run here, where the weekly run with the latest
      # MoonBit runs them too: the finder reads the compiler's parse tree,
      # whose format a new toolchain may change.
      - name: Test the mutation runner on its fixture
        run: python3 -m unittest discover -s scripts/mutation -v

      # The runner's forced-fail self-test, on each package of the fixture
      # module that has tests: a mutant that puts an abort at the start of
      # every function must be killed, or the runner could see no mutant.
      # Each run of the runner starts with it too.
      - name: Run the mutation runner's self-test on its fixture
        run: python3 scripts/mutation/run.py --root scripts/mutation/fixture --self-test-only calc log

      # The site counts (mutation/site-counts/) must be what the site
      # finder gives on this commit, so a change that alters sites updates
      # them, and with the latest MoonBit this reports a compiler that
      # finds other sites. No package's sites may drop below the counts at
      # the merge base with main but in the definitions that the change
      # deletes or changes, or as mutation/approved-drops.txt records.
      - name: Check the site counts against this commit and the merge base with main
        run: python3 scripts/mutation/ratchet.py check --base origin/main

      # The exclusion list (exclusions.toml): every entry is in a category
      # of ADR 0006, with what its category needs, and the entries whose
      # definition's text changed since they were made are listed as
      # stale, for their triage. It reads the definitions with the
      # compiler's parser, so it runs here, as the runner's tests do.
      - name: Check the exclusion list
        run: python3 scripts/mutation/exclusions.py check

      # What several e2e test files share lives in the harness files, so
      # that removing a test file breaks no other. The check runs the
      # compiler's front end on the harness files with each test file
      # alone, and its test does the same on small modules.
      - name: Check that no e2e test file uses what another test file defines
        run: python3 scripts/check-e2e-helpers.py

      - name: Test the check of the e2e test files
        run: scripts/test-check-e2e-helpers.sh

  test:
    name: test (linux/${{ matrix.arch }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.full != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The runner check, OpenSSL, MoonBit and moon update.
      - uses: ./.github/actions/native-setup
        with:
          machine: ${{ matrix.machine }}
          toolchain: ${{ inputs.toolchain }}

      - run: moon version --all

      - name: Test every module natively
        run: moon test --target native

  release-test:
    name: release-mode tests (linux/${{ matrix.arch }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.full != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The runner check, OpenSSL, MoonBit and moon update.
      - uses: ./.github/actions/native-setup
        with:
          machine: ${{ matrix.machine }}
          toolchain: ${{ inputs.toolchain }}

      # A release build may fuse floating-point multiply-adds, so that a
      # seeded log-normal delay differs from the one wasm-gc draws. moon
      # passes -ffp-contract=off to each C compile, and the engine's tests
      # check that nothing is fused.
      - name: Test the engine in a release build
        run: moon test --target native --release -p smock/smock/engine

      - name: Test the OpenSSL bindings under AddressSanitizer and LeakSanitizer
        run: scripts/test-openssl-asan.sh

  # The release binary, and every check that runs it or the image that
  # packs it.
  release:
    name: release binary and image (linux/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      SMOCK_VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      # The runner check, OpenSSL, MoonBit and moon update.
      - uses: ./.github/actions/native-setup
        with:
          machine: ${{ matrix.machine }}
          toolchain: ${{ inputs.toolchain }}

      - run: moon version --all

      - name: Install helm, kubectl and kind
        run: scripts/install-kubernetes-tools.sh "$RUNNER_TEMP/bin"

      # The cluster of the Helm chart's test below. Creating it takes most
      # of that test's time and needs neither the binary nor the image, so
      # it starts here and goes on while the binary compiles.
      - name: Start creating the kind cluster
        run: scripts/test-helm-chart-on-kind.sh --start "$RUNNER_TEMP/kind"

      - name: Build the release binary
        run: scripts/build-release.sh

      - name: Check smock --version
        run: >-
          scripts/check-version.sh dist/smock
          "$SMOCK_VERSION"
          "${GITHUB_SHA::12}"
          "moonc $(moonc -v | cut -d' ' -f1)"

      # h2spec publishes a Linux binary for amd64 only, so it runs there.
      # Every case of its generic, http2 and hpack sections runs against
      # the plain port (h2c) and the TLS port (h2, by ALPN);
      # scripts/h2spec/plain.txt and tls.txt list the cases that do not pass
      # on each, with their reasons, and the log names a listed case that
      # passes, so that it can come off.
      - name: Install h2spec
        if: matrix.arch == 'amd64'
        run: scripts/install-h2spec.sh "$RUNNER_TEMP/bin"

      - name: Run h2spec against the plain port (h2c) and the TLS port (h2)
        if: matrix.arch == 'amd64'
        run: scripts/check-h2spec.sh dist/smock plain tls

      # grpcurl, a real gRPC client, pinned by version and SHA-256, calls
      # the release binary on the plain port (h2c) and on the TLS port (h2):
      # list and describe through reflection, calls with JSON and metadata,
      # the same calls with -protoset and no reflection, an error with
      # details through -format-error, and health checks. Each call's
      # expected output is in scripts/grpcurl/calls, and the gRPC guide
      # shows only those calls. Any difference fails the step and shows
      # what grpcurl printed.
      - name: Install grpcurl
        run: scripts/install-grpcurl.sh "$RUNNER_TEMP/bin"

      - name: Call smock with grpcurl on the plain port (h2c) and the TLS port (h2)
        run: scripts/check-grpcurl.sh dist/smock

      # This tests the check's own logic, which is the same on every
      # machine, so it runs on one.
      - name: Test that the grpcurl check fails on each difference
        if: matrix.arch == 'amd64'
        run: scripts/test-check-grpcurl.sh dist/smock

      # The release workflow builds and smoke-tests the image the same way.
      - name: Build the container image
        run: docker build --provenance=false --tag smock:ci .

      - name: Smoke-test the container image
        run: >-
          scripts/smoke-test-image.sh smock:ci
          "$SMOCK_VERSION"
          "${GITHUB_SHA::12}"
          "moonc $(moonc -v | cut -d' ' -f1)"

      - id: syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          syft-version: v1.54.1

      # The release workflow makes the published image's SBOM the same way,
      # but only for a tag: this checks in every run that smock, its
      # MoonBit modules, and the runtime, mimalloc and simdutf of the
      # toolchain get into it. The modules are every module the build
      # resolves, moonhttp and the modules it imports among them; they and
      # the last three must be as NOTICE names them.
      - name: Make the image's SBOM as the release workflow does
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          scripts/resolved-modules.sh --json >modules.json
          "$SYFT" scan docker:smock:ci --output spdx-json=sbom.spdx.json
          scripts/add-smock-to-sbom.sh sbom.spdx.json "$SMOCK_VERSION" "$GITHUB_SHA" modules.json
          jq -e --arg version "$SMOCK_VERSION" --slurpfile modules modules.json '
            [.packages[] | "\(.name)@\(.versionInfo)"] as $packages
            | ($packages | index("smock@\($version)")) != null
            and any(.packages[]; .name == "moonbitstack/moonhttp")
            and ([$modules[0][] | "\(.name)@\(.version)"] - $packages) == []' sbom.spdx.json
          scripts/check-sbom-notice.sh sbom.spdx.json

      # Installs the chart with this image on the cluster started above,
      # into a namespace that enforces the Restricted Pod Security Standard,
      # and checks that a ConfigMap update reaches smock without a restart.
      # It waits for the cluster first, and shows how its creation went.
      - name: Test the Helm chart on kind
        run: scripts/test-helm-chart-on-kind.sh --cluster "$RUNNER_TEMP/kind" smock:ci

      # An external JSON Schema validator and smock check must agree on
      # every Definition-file fixture under schema/v1/fixtures/.
      - name: Cross-check the JSON Schema with smock
        run: scripts/check-schema.sh dist/smock

      # The examples of the user documents, run with this binary on every
      # push, so that one that stops working fails the push that broke
      # it: smock check on every whole Definition file, with the context
      # that scripts/doc-examples/ keeps for it; the Mockoon guide's smock
      # check and smock render commands, whose output must be what the
      # guide prints; and the Jsonnet example, exported with the pinned
      # jsonnet, which is checked against its SHA-256.
      - name: Install jsonnet
        run: scripts/install-jsonnet.sh "$RUNNER_TEMP/bin"

      - name: Run the documents' examples with smock
        run: python3 scripts/check-doc-examples.py dist/smock

      # The binary that scripts/build-release.sh made above and the image
      # packs, handed to the SDK job and to ci.yml's job keep, which keeps
      # it as smock-linux-<arch> once every job passed and removes this
      # copy. Its --version names this run's commit. Where a job failed,
      # this copy stays, so that a re-run of the failed jobs within its 7
      # days finds it.
      - name: Hand over the release binary
        if: inputs.toolchain == 'pinned'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/smock
          retention-days: 7
          if-no-files-found: error

  # protobuf's conformance suite against smock/protobuf
  # (protobuf-conformance/README.md). protobuf publishes no runner, so
  # scripts/build-conformance-runner.sh builds conformance_test_runner from
  # the pinned protobuf release, and the build is cached until the script,
  # or the protoc it pins, changes. The runner drives the testee, which
  # scripts/check-conformance.sh builds with moon, and fails on a result
  # that differs from protobuf-conformance/failure_list.txt; the lists of
  # what differs are then kept. It runs on every push to main, also where
  # the tests are skipped: a branch can restore the cache that main saved,
  # and not another branch's.
  protobuf-conformance:
    name: protobuf's conformance suite (smock/protobuf)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install MoonBit (${{ inputs.toolchain }})
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: scripts/install-moonbit.sh "$TOOLCHAIN"

      - name: Update the mooncakes registry index
        run: moon update

      # The runner links the image's C++ library, so the cache is the
      # image's, by its ImageOS, such as ubuntu24.
      - name: Name the runner image
        id: image
        run: echo "os=$ImageOS" >>"$GITHUB_OUTPUT"

      - name: Restore protobuf's conformance runner
        id: runner
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/smock/conformance-runner
          key: conformance-runner-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-conformance-runner.sh', 'scripts/install-protoc.sh') }}

      - name: Build protobuf's conformance runner
        if: steps.runner.outputs.cache-hit != 'true'
        run: scripts/build-conformance-runner.sh ~/.cache/smock/conformance-runner

      # Saved as soon as it is built, so that a failing suite does not
      # build it again on the next run.
      - name: Cache protobuf's conformance runner
        if: steps.runner.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/smock/conformance-runner
          key: ${{ steps.runner.outputs.cache-primary-key }}

      - name: Run protobuf's conformance suite against smock/protobuf
        run: >-
          scripts/check-conformance.sh
          ~/.cache/smock/conformance-runner/conformance_test_runner
          "$RUNNER_TEMP/conformance"

      - name: Keep what differs from the failure list
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: protobuf-conformance
          path: ${{ runner.temp }}/conformance
          retention-days: 7
          if-no-files-found: ignore

  # The SDK job (llm-sdks/README.md): the official openai-python and
  # anthropic-sdk-python, pinned with every package they need by version
  # and hash, read the LLM responses of the amd64 release binary that the
  # job release hands over. It builds nothing. The weekly run with the
  # latest toolchain (latest-toolchain.yml) does not run it.
  llm-sdks:
    name: Read LLM responses with the official SDKs
    needs: release
    if: inputs.toolchain == 'pinned'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-linux-amd64
          path: dist

      # An artifact does not keep the file's mode.
      - run: chmod +x dist/smock

      - uses: actions/setup-python@v7
        with:
          python-version-file: llm-sdks/.python-version

      - name: Read smock's LLM responses with the pinned SDKs
        run: scripts/check-llm-sdks.sh dist/smock
