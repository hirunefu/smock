# xml/parser.mbt's equivalent mutants (#411, the second of the six triage
# tickets of xml's survivors for #325): 9 of the 24 survivors of the first
# weekly run (44423781036) in xml/parser.mbt, which no input to xml's
# public interface can tell from the code; tests kill the other 15. The
# compiler's output differs for each. Two widen Parser::char's test of
# decode's result to 0, which decode never returns. Two delete a step past
# markup, `<![CDATA[` and a start tag's `>`, whose bytes the loop after it
# then reads as characters, checks and keeps nothing of. Four move or
# remove Parser::unique's bound of eight attributes, past which the names
# are sorted rather than checked in place: both ways find the same
# repetition, so the bound chooses only the cost that the README's
# Documents and the doc comment state, which no test reads. One changes
# unique's test of `first` at 0, which `first` never is. None of them is
# deleted as redundant code: the two steps say where a construct's content
# starts, and the bound keeps a tag of a few attributes from allocating,
# on the request path. A separate agent context, which wrote neither these
# entries nor xml's tests, then tried to kill each from the spec, and
# `adversarial` records what it tried. The maintainer reads every entry,
# since xml is a protocol package.
#
# The maintainer accepted these 9 entries on 2026-11-21 (#325), as
# EQUIVALENT: unique's bound changes only time and allocation, and the
# steps past `<![CDATA[` and a tag's `>` stay.

[[exclusion]]
mutant = "xml/parser.mbt,Parser::char,ROR,<,<=,0"
text = "e62ceae9a19dd680"
category = "EQUIVALENT"
