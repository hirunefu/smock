# http1/parser.mbt (#406, part 2 of 5 of http1's triage for #324): survivors
# of the first weekly run (44423781036) in Parser::Parser, Parser::feed and
# the first part of Parser::scan_head that no input can tell from the code,
# and one capacity hint. Each argument is in its reason. The compiler's
# output differs for each. Two move a boundary of the body limit's clamp
# to where both arms give the same limit. Two in feed change at most
# where the bytes held sit in the buffer, or in which array, past what any
# reader reads (a third, feed's bound of 2^30 - 1, went with feed's growth
# loop into grown_capacity in #433, where a white-box test of its contract
# kills it). Seven change only how scan_head takes a run of a field
# value's bytes (the loops over eight bytes and one byte at a time, and
# their bound `stop`), which the outer loop takes the same way, one byte at
# a time. Four leave out a whole piece of code (feed's reuse of its buffer,
# the field value's shortcut, and each of its two loops) that is there only
# for speed or allocation: by what the code is for (the nineteenth round's
# rule), they are EQUIVALENT, as xml's Parser::unique's bound was, and no
# deletion is proposed. scan_head reads words unchecked
# (unsafe_read_uint64_le), so its verdicts are native: none of its seven
# reads past `stop`, at most `end`, in a buffer a test can hold (since #435
# the code reads no word past `stop` in a buffer of any length). The
# implementer also compared a digest
# of every answer of the parser on 2,500 random streams fed in random pieces
# with random limits, with each mutant applied by hand and without it: the
# same for each, on wasm-gc and, for scan_head's, natively, while four
# variants that are not equivalent changed it or trapped (a scratch test,
# not committed). A separate agent context, which wrote neither these
# entries nor http1's tests, then tried to kill each from the spec (RFC 9112,
# RFC 9110, docs/running.md and Parser's doc comments) and could not, and
# `adversarial` records what it tried. It ran the ARID entry, which has no
# `adversarial`, the same way: in its copy and applied by hand, every answer
# and state is the code's, and only where the bytes sit differs, in every
# run. It corrected the native sentence of four reasons: the loops' mutants
# read fewer words, or words at other places in a run, never past `stop`.
# None differs from the code at http1's public interface; feed's `<=` and
# its new array differ only in where the bytes held sit (`start`, `end`, the
# bytes past `end` and the array), which is private. #433 (the twenty-second
# round, 2026-11-21) then changed Parser::next, Parser::feed and
# Parser::scan_head: next waits for a Content-Length body by comparing the
# bytes at hand with the length, feed's growth of its buffer is
# grown_capacity, and the head scan keeps whether a byte of the method or
# the target was seen, not how many. While #433 was open, the capacity
# hint's argument and feed's `<=` did not hold (`start + length` could wrap
# at one place and not at the other); with the fix in, the input that showed
# it needs more with each mutant applied by hand, as with the code. Feed's
# two and scan_head's seven entries here were read again against the new
# code, refreshed to its text, and each mutant survived by key, on wasm-gc
# and natively. A separate agent context, which wrote neither these entries
# nor #433's change nor http1's tests, then tried them again on the new
# code, with inputs near the top of Int32 this time, and killed none;
# `adversarial` records what it tried, before what the earlier attempt tried
# on the old code. It ran the capacity hint the same way: in its copy and
# applied by hand, every answer and state is the code's, and only where the
# bytes sit differs. It found two sums that can still pass 2^31 - 1 with a
# buffer of about 2 GiB, which no caller holds (smock's limits are at most
# 2^30), and reported them as an issue (#435): scan_head's word loops'
# `at + 8`, after which the code read past the array, and feed's
# `used + data.length()`, after which blit aborts. #435 then made both word
# loops test `stop - at >= 8`, which cannot wrap, since `at` is at most
# `stop` where they test it (the twenty-second round's rule: a difference
# only at a size no test may allocate is resolved by a code change). feed's
# need stays as it is, recorded in #435 (the twenty-third round); no entry
# here leans on it. Feed's two entries, scan_head's seven and the capacity
# hint were read again against that code: their reasons no longer carry a
# clause on such a buffer, scan_head's are refreshed to its text, and the
# word loop's IFC and ROR, whose keys changed with the test, are entries
# for their new keys. Each mutant survived by key, on wasm-gc and, for
# scan_head's, natively. One reason still names a
# size no test may allocate, a new one: with `stop` below `at`, the
# mutant's `stop - at` wraps once the header size limit and the bytes
# scanned add up to more than 2^31 (a limit over 2^30 and more than 2^30
# bytes held). A separate agent context, which wrote neither these
# entries nor #435's change nor http1's tests, then tried the nine again on
# that code, beside a copy of b0802c2c's head scan, with positions up to
# 2^31 - 1 reached by numbers alone (a copy of the scan over a virtual
# buffer, whose bytes are given by their index), and killed none;
# `adversarial` records what it tried, before what the earlier attempts
# tried on the earlier code. It ran the capacity hint the same way: in its
# copy and applied by hand, every answer and state is the code's, and only
# the buffer's length and where the bytes sit differ (it corrected that
# reason, which named only when the buffer grows). It found the new clause
# true: with a header size limit of 2^30, smock's largest, the mutant scans
# as the code; with 2^30 + 1 and 2^30 bytes scanned, it needs more where the
# code gives 431, or reads past the array. The native verdicts on this code
# are CI's amd64 runner's, in the packages run after the merge. The
# maintainer reads every entry, since http1 is a protocol package.

[[exclusion]]
