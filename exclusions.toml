# in the definitions after parse_head that no input can tell from the code.
# Each argument is in its reason. The compiler's output differs for each but
# the table's, which the comparison does not compare (a top-level value, not
# a function). Seven change only how scan_head takes a run of a field name's
# or a target's bytes (the shortcuts, their loops over eight bytes and one
# byte at a time, and the word loop's bound), which the outer loop takes the
# same way, one byte at a time, as #406's seven for a field value. Four of
# them leave out a whole piece of code (the name's shortcut, the target's,
# and the target's two loops) that is there only for speed: by what the code
# is for (the nineteenth round), they are EQUIVALENT, and no deletion is
# proposed. scan_head reads words unchecked (unsafe_read_uint64_le), so its
# verdicts are native: none of the seven reads past `stop`, at most `end`
# (since #435 in a buffer of any length), and each survived natively on
# CI's amd64 runner in the weekly run. Three
# move a boundary that only `A` or `Z` reaches in a word that holds no `a`
# or `z` (100-continue, and the names is_name is asked for). Two in
# parse_field move a bound to where the byte is always the line's CR, or to
# an inverted slice that core clamps to the same empty view; one is the
# expect check's last empty element; one is a lookup table's 257th entry,
# which no byte reads. None differs at http1's public interface; parse_field
# and is_name differ only for white-box calls no caller makes, as each
# reason says. The implementer compared digests of every answer of the
# parser on 4,000 random streams in random pieces, of expects_continue on
# 5.6 million values, of the parser on names one letter from those it reads
# and of the response encoder, with each mutant applied by hand and without
