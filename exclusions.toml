# http1/response.mbt, http1/sse.mbt and http1/stream.mbt (#408, part 4 of 5
# of http1's triage for #324): survivors of the first weekly run
# (44423781036) that no input can tell from the code, and five capacity
# hints. Each argument is in its reason; each EQUIVALENT mutant agrees with
# the code on every argument, white-box calls of the private functions
# included. The compiler's output differs for each. The implementer also
# folded into digests what http1's public functions answer where these
# mutants could differ: field_octets of every pair of a high surrogate
# with each code unit from 0xD700 to 0xE0FF and with every 251st, and of
# every code unit alone and between two letters; is_token and
# is_field_value of every code unit alone and between two letters;
# encode_response with statuses at Int32's edges and around each power of
# ten and bodies of 0 to 101 bytes, to HEAD and not; events of 0 to 40
# characters with each line break, and stream parts of 1 to 300 bytes.
# With each mutant applied by hand the digests were the code's, while
# seven variants that are not equivalent changed them or aborted (a
# scratch test, not committed). decimal_length's and write_decimal's
# `n < 0` only chooses between two ways of writing a number that agree on
# every n of 0 or more (the loop is the fast path every response takes),
# so moving the boundary to 0 changes no octet; the check is needed for a
# negative status, and no survivor makes it always true, so nothing here is
# a candidate for deletion. is_token's and is_field_value's `c >= 0x80` and
# `c < 0x80` are needed for code units of 0x100 and above, whose low byte
# could otherwise pass for a tchar or a control; between 0x7F and 0xFF the
# byte lookup gives the same answer.
# A separate agent context, which wrote neither these entries nor http1's
# tests, then tried to kill each from the specs and smock's documents, and
# `adversarial` records what it tried. It tried the five capacity hints
# too, which have no such field: core's Buffer takes a hint below 1 as 1,
# grows to at least what each write needs, and `to_bytes` copies
# `data[0:len]`, so events, heads and chunks are the same octets with each
# hint (5,801 event texts of 0 to 60 characters, 756 heads, parts of 0 to
# 300 bytes and of 4,095, 4,096 and 65,536, by hand on wasm-gc and
# natively). No input, through http1's public interface or in a white-box
# call, tells any of the ten EQUIVALENT mutants from the code. The
# maintainer reads every entry, since http1 is a protocol package.

[[exclusion]]
mutant = "http1/response.mbt,decimal_length,INT,0,1,0"
text = "6462e0f39a3ad0fd"
category = "EQUIVALENT"
