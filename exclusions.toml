# xml/chars.mbt's equivalent mutants (#410, the first of the six triage
# tickets of xml's survivors for #325): 13 survivors of the first weekly
# run (44423781036) that no input to xml's public interface can tell from
# the code. The compiler's output differs for each. Nine change only which
# negative number decode returns for bytes that are not well-formed UTF-8,
# and every caller of decode reads only whether its result is negative; a
# white-box test of the private decode could still see the number, which
# is not the -1 decode documents. The guards they change are not deleted
# as redundant code: they give that -1. Two widen an else-if to a lead
# byte that the branch before it takes, and two change local_start's test
# at a colon at byte 0, which no caller can pass. A separate agent
# context, which wrote neither these entries nor xml's tests, then tried
# to kill each from the spec, and `adversarial` records what it tried. The
# maintainer reads every entry, since xml is a protocol package.
#
# The maintainer accepted these 13 entries on 2026-11-21 (#325): decode's
# nine stand as equivalent at the package's public interface, with no
# white-box test of decode and no deletion of its guards.

[[exclusion]]
mutant = "xml/chars.mbt,decode,INT,0,-1,0"
text = "dfd20a1ad3020126"
category = "EQUIVALENT"
reason = "In the two-byte branch, `if c1 >= 0` becomes `c1 >= -1`, which always holds. They differ only when the byte after the lead is no tail, so that `c1` is -1. The code then returns -1, and the mutant `packed(-1, 2)`, which is -6, since `x | -1` is -1. decode is private, and its callers read only whether the result is negative: Parser::char and Parser::skip_name refuse the input at the same byte with the same message, Parser::reference finds no name start in a negative code point (`decoded >> 3`), and Parser::text and selection decode only input that parsing accepted, where decode is never negative."
compiler_output = "differs"
adversarial = { context = "a separate agent context of #275's step 3, on 2026-11-21, which wrote neither this entry nor any of xml's tests", tests = ["decode's own result does differ: C2 at the input's end gives -6, where the code gives the -1 that decode's doc comment states. Only a white-box test of the private decode could pin that number; no source the spec names for xml gives it, and the spec's seam is the package's public interface (CONTRIBUTING, What makes a good test: it drives a public interface and survives a refactor that keeps the behaviour), so no such test was written, and the claim stands as the package's callers see it", "a differential in a scratch white-box test of xml, not committed: a copy of decode carrying each of this batch's 11 mutations beside the real function, on every first and second byte (or the input's end) followed by 14 values of the third and the fourth (00, 41, 7F, 80, 81, 8F, 90, 9F, A0, BE, BF, C0, FF, or the end), each with and without a byte after them: 11,993,344 sequences. Read as decode's callers read the result (whether it is negative; when it is not, the code point and the length; and is_name_start of the code point, which Parser::reference reads with no sign check), no mutant differs from the code, and the copy without a mutation is decode on every sequence. The same harness reports a difference for each of six variants that are not equivalent: `c1 >= 1`, `c2 >= 1`, `c3 >= 1`, `b0 >= 0xE1`, `b0 >= 0xF1`, and decode's last -1 made 0", "a scratch black-box test of xml, not committed, run with the mutant applied by hand in the worktree: 18 lead bytes (80, BF, C0, C1, C2, DF, E0, E1, EC, ED, EE, EF, F0, F1, F3, F4, F5, FF), alone and before every one to three bytes of 7F, 80, 8F, 90, 9F, A0, BF, C0, `a` and `<`, in 25 places of a document (text, after a character, an attribute value in either quote, an element name's first and later byte and after its prefix's colon, an attribute name's first and later byte, a reference's name in text and in an attribute value, a comment, a processing instruction's target and data, CDATA, the XML declaration's version and encoding, before and after the root element, an end tag's name, and cut off at the input's end), and 12 documents with colons in their names: 499,962 documents, each parsed and, when it parses, read with select, first_node, next_node, utf8_value and value_is on four paths, the outcomes hashed against the unchanged code's. It and xml's 48 tests pass with the mutant (49 of 49); it fails alone with decode's last -1 made 0, `c1 >= 1`, `c3 >= 1`, `b0 >= 0xE1` and local_start's `colon < 3`", "the sources read for an input whose documented result the mutant changes: XML 1.0 §2.2 and §2.3, RFC 3629 §3 and §4, the README's Documents (\"Bytes that are not well-formed UTF-8 are an error\") and matching.md's XML bodies (a body that is not XML fails every xml condition; the engine reads neither the error's position nor its message). The error is the same: Parser::char and Parser::skip_name raise it at the sequence's first byte, and Parser::reference at the `&`, whatever negative number decode gives"] }
