# remove Parser::unique's bound of eight attributes, past which the names
# are sorted rather than checked in place: both ways find the same
# repetition, so the bound chooses only the cost that the README's
# Documents and the doc comment state, which no test reads. One changes
# unique's test of `first` at 0, which `first` never is. None of them is
# deleted as redundant code: the two steps say where a construct's content
# starts, and the bound keeps a tag of a few attributes from allocating,
# on the request path. The separate context that tries to kill each from
# the spec comes after the implementer who wrote these entries, and fills
# in `adversarial`; until then it says so. The maintainer reads every
# entry, since xml is a protocol package.

