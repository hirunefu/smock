in four broken by a byte replaced or inserted, or cut short; body limits from 0 to 2^31 - 2), each fed whole, a byte at a time, in random pieces and, for 200 of them, cut in two at every byte (21,651 cuts), every answer of next and in_request folded in; 31,248 responses of encode_response (31 statuses from Int32's edges through each power of ten, nine body lengths, seven requests, close, a Date, four header sets with characters beyond ASCII and lone surrogates); field_octets, is_token and is_field_value of every code unit alone and between two letters; field_octets of every surrogate pair (1,048,576); 756 streamed responses with parts of 0 to 300 bytes and of 4,095, 4,096 and 65,536; 5,801 event texts (every one of up to four of `a`, CR, LF, space, `é`, an emoji and `:`, and 3,000 random ones of up to 60), with and without event and id; 46,338 Date values from 1969 out to about year 200,000 either side of the epoch. With this mutant applied by hand at the finder's position (line 56, column 29), http1's 111 tests and the digest test pass and all seven digests are the code's, on wasm-gc and natively (arm64). Eight variants that are not equivalent, applied the same way, each change a digest or stop the digest test, and each fails at least one of http1's own tests (`self.size < end - i - 1`, `write_padded(out, year, 5)`, `u - 0xD7FF`, is_token's `>= 0x7e`, is_field_value's `< 0x7f`, decimal_length's `n < -1`, `i + 2 <` in lines, part's `radix=10`)", "the sources read for an input whose documented result the mutant changes: RFC 9112 §2.2 (the empty line before a request line), §7.1 (chunk-size = 1*HEXDIG, last-chunk = 1*(\"0\") [ chunk-ext ] CRLF, the coding complete at a chunk of size zero and the empty line after the trailer section), §7.1.1 and §7.1.3's decoding; docs/running.md's --body-limit row; the documentation of Parser, Parser::Parser, Parser::next and Parser::in_request. None names one: every chunk size begins with a hexadecimal digit, which SizeStart writes i