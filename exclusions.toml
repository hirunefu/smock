reason = "`if n <= 8` becomes `false`, so every tag is checked by sorting, a tag of eight or fewer attributes too, rather than in place. Both ways raise the same error, or none. In place, it is at the first attribute whose name repeats an earlier one's. By sorting, the pairs of name and start are sorted, the names in BytesView's shortlex order, which is 0 only for equal names, so each name's attributes are adjacent and in order of start; every pair whose name equals the one before it is a repetition, and the loop keeps the one that starts first: the same attribute, named by the same bytes. With 0 or 1 attributes neither finds any. The bound chooses only the cost, which the README's Documents state (linear time, but O(n log n) to sort the names of a tag with more than eight attributes) and the doc comment (a tag with a few is checked with no allocation); no test reads time or allocation."
