reason = "`s[dot + 1:]` becomes `s[dot - 1:]`: the check of an IPvFuture's address takes the version's last digit and the `.` before the address. It runs only after the check of the version (`&&`), so the characters it takes besides the address are a hexadecimal digit, a letter or a digit that is_unreserved takes, or the `.`, which is_unreserved takes too; the guard's `dot > 1` keeps the start at 1 or more. So is_ip_future gives the same answer for every string, a white-box call included, and so do is_host_value, is_authority_form and the parser; it differs nowhere. Any start from 0 to `dot + 1` gives the same answers. The `+ 1` says where the address begins, as xml's steps past `<![CDATA[` do: by what the code is for (the nineteenth round, point 4) it is EQUIVALENT, and no deletion is proposed."
