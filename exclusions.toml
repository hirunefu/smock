reason = "`self.buf.length() - self.end < data.length()` becomes `<=`: when the room after the bytes held is exactly the length of `data` (or both are 0), feed moves the bytes it holds to the front of its buffer before it appends `data`, instead of appending in place. The buffer's length is then at least `end + data.length()`, so at least `used + data.length()`: feed keeps the same array, and the bytes from `start` to `end` are the same, at other indexes. Every reader of the buffer (the head scan, parse_head, the slice of a Content-Length body, Chunks::decode) reads only from `start` to `end` and counts from `start`, so no request, status or answer of in_request changes; only where the bytes sit in the buffer does. The wait for a Content-Length body compares the bytes at hand, `end - start`, with the length, and takes `[start:start + length]`, so it does not depend on where the bytes sit either: while #433 was open, `start + length` could pass 2^31 - 1 at one place and not at the other (the twenty-second round's reader found an input), and #433 removed that sum. Nor does the head scan read past `end`: since #435 its word loops read a word only when `stop - at >= 8`, with `at` at most `stop` and `stop` at most `end`, so where the bytes sit decides nothing in a buffer of any length. The need the mutant computes when it moves the bytes, `used + data.length()`, is at most the buffer's length there, so grown_capacity keeps the array."
