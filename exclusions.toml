reason = "The loop over a field value's bytes one at a time, after the loop over eight at a time, is never taken: the bytes it would take go through the outer loop instead. The head scan's shortcuts take a run of bytes that leaves the scan where it is (its doc comment), and only up to `stop`, at most `end` and at most the header size limit past `start`, so that the byte past the limit is checked as it would be alone. The outer loop runs the same state machine on each byte, one at a time, with the size check after each: for each byte of a field value that is_field_value_byte takes and that is not a CR, Section::after keeps the section at FieldValue, and the line ends, the field count and the result stay as they are. So the scan ends in the same state with the same result for every input; only its speed changes. Natively each word it reads lies before `stop`, at most `end`, as the code's do, though at other places in a run (after each byte the outer loop takes), so nothing is read past the bytes fed. The loop is there for speed, which no test reads; by what the code is for (the nineteenth round), it stays, as xml's Parser::unique's bound did."
compiler_output = "differs"
