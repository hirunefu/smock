adversarial = { context = "a separate agent context of #275's step 3, on 2026-11-21, which wrote neither this entry nor any of http1's tests", tests = ["read RFC 3986 §3.2.2 (IPvFuture = `v` 1*HEXDIG `.` 1*( unreserved / sub-delims / `:` ), the `v` case-insensitive) and §2.3 (unreserved = ALPHA / DIGIT / `-` / `.` / `_` / `~`, which holds every HEXDIG and the `.`), then looked for a string on which checking the address from the version's last digit (`s[dot - 1:]`) changes the answer. The address's check runs only after the version's (`&&`), so `s[1:dot]` is then all ASCII hexadecimal digits; `s[0]` is `v` and `s[dot]` the `.`, so no edge of these views splits a surrogate pair (core's view moves such an edge inward), and the code units the mutant adds are that digit and the `.`, which is_unreserved takes, while those from `dot + 1` on are read as the code reads them. It differs nowhere, a white-box call included. Tried: a character that is no hexadecimal digit, a lone surrogate or a surrogate pair in the version or just before the `.`, every code unit there and just after the `.`, the `.` first or last, two dots, and an empty version or address", "a scratch white-box test of http1, not committed, run beside http1's 113 tests: copies of is_visible_ascii, is_uri_host and is_ip_future with each mutation and controls behind a number, compared on every input with the real functions, whose answers, with those of the public checks and of the parser, are folded into digests. is_visible_ascii on every code unit from 0 to 0xFFFF, lone surrogates included, alone, twice, before a `/`, between two letters and in a query, and on every pair of code units from 0x60 to 0x13F, bare and in a path (428,032 calls); is_uri_host on every string of up to five of 16 symbols (`[`, `]`, v, V, 1, f, g, `:`, `.`, `@`, `~`, `%`, space, U+00E9, U+1F600 and a lone high surrogate), on `[` with up to five of them and `]`, and on `[` followed by every code unit, alone, twice or with a `]` (2,499,124 calls), each also through is_host_value with no port, `:80` and an empty one, is_authority_form with and without `:443`, and is_request_target for CONNECT and for GET (17,493,868 calls); is_ip_future on every string of up to four of 23 symbols (v, V, 0, 9, a, f, F, g, G, `.`, `:`, `-`, `_`, `~`, `!`, `$`, `@`, `/`, `%`, space, U+00E9, U+1F600 and a lone low surrogate), on `v` with up to six and `V` with up to five of 12 (v, 0, f, F, g, `.`, `:`, `-`, `~`, `!`, `@` and a lone high surrogate), and with every code unit in the version, just before the `.`, just after it, at the end and in place of the `v` (4,149,131 calls), each also in brackets through is_host_value with and without a port, is_authority_form and is_request_target for CONNECT (16,596,524 calls); and the parser on 3,290 IP literals in brackets or cut before the `]` (also with UTF-8, a stray 0xFF, DEL and 0x80), each as a Host field, as a Host with a port and as a CONNECT's target (9,870 answers). On the code, no mutated copy differs from the real function on any input, nor do the copies with `c >= 0x121`, the length check left out, `host.length() >= 4`, or the address checked from 0 or from `dot - 2`; the controls `c >= 0x7e` (127 inputs differ), `c >= 0x122` (131), `host.length() >= 5` (4, `[::]` among them), `s[dot + 2:]` (75,866) and the address checked from `dot - 1` with the version checked only up to `dot - 1` (103,842) are each caught", "the mutant applied by hand to http1/target.mbt in the worktree (the change made, the tests run, the file restored): http1's 113 tests pass, the real (mutated) functions equal the copies of the code on every input above, and every digest of the scratch test is the code's, on wasm-gc and natively (arm64, for information: no definition of target.mbt uses an unchecked access, so wasm-gc decides). Variants applied the same way: `s[dot + 2:]` fails checks_test.mbt's Host value test and changes the digests of is_uri_host, is_ip_future, the public checks and the parser; `s[0:]` keeps every digest; and the copy that checks the address from `dot - 1` but the version only up to `dot - 1` differs on 103,842 inputs, which shows that a start at the version's last digit leans on the version's check covering that digit"] }
