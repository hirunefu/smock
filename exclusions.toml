# http1's uncovered points (#324, the criterion "L1 and L2"): three match
# arms for a state the code never hands them. In Chunks::decode and
# Parser::scan_head, a pass of the loop that sets the state ends the call or
# leaves the state before the next pass, and no call starts in it; no
# caller passes Section::after a section that has ended or is broken. Each
# argument shows it from the code. No operator mutates these arms, so they
# are points, not mutants. Were one reached, it would give the 400 that a
# broken state gives. UNREACHABLE, each with its written argument; the code
# is unchanged. A separate agent context tries each argument after the
# context that proposed it, and the maintainer reads every entry, since
# http1 is a protocol package. #435 changed scan_head's word loops, after
# the arm: scan_head's point keeps its position and its argument, which
# holds line by line, and its text is refreshed. A separate agent context,
# which wrote neither the entry nor #435's change, read the argument again
# against that code line by line and found no input that reaches the arm;
# with the arm made an abort in a scratch copy, http1's tests and the
# corpora of its harness (2,314,631 runs) pass on wasm-gc and natively.

[[exclusion]]
file = "http1/chunked.mbt"
definition = "Chunks::decode"
position = "118:17"
text = "1ebd191458fbd90c"
category = "UNREACHABLE"
reason = "The arm for the state Broken (`Broken => ()`), which the loop never sees: a pass that sets Broken returns Err(400) before the next pass, and no call of decode starts in Broken."
argument = "Only decode sets a Chunks' state to Broken: the `_ => Broken` arms of ExtBws, ExtNameStart, ExtAfterName, ExtValueStart, ExtQuoted and ExtQuotedPair, and after_value's `_ => Broken`, which Size, ExtName, ExtToken and ExtAfterQuoted call. Chunks::Chunks and take_body set SizeStart. Within a call: each of those arms reaches `if self.state is Broken { return Err(400) }` before `i += 1`; Data, the one arm that skips that check (with `continue`), sets only DataCr; and the arms that return before it (SizeStart, SizeLf, DataCr, DataLf and Trailer) set nothing before they return, so they leave the state the pass started in. So the loop never starts a pass in Broken, and decode returns with the state Broken only through that `return Err(400)`. Across calls: Chunks is private to http1, and the package's one Chunks is a Parser's `chunks` field, made by Parser::Parser. Parser::next is the one caller of decode outside the tests; on Err it sets `self.invalid`, and from then on next returns Invalid at its first line (`if self.invalid is Some(status)`), before it reaches decode. So no call of decode starts in Broken. The white-box reference parser (RefParser::next, reference_parser_wbtest.mbt) calls decode the same way, behind the same check."
reviewer = ""

[[exclusion]]
file = "http1/parser.mbt"
definition = "Parser::scan_head"
position = "72:29"
text = "7ed4adc092ef4781"
category = "UNREACHABLE"
reason = "The arm for the scan states EmptyLine and Broken (`EmptyLine | Broken => scan = Broken`), which the loop never sees: the pass that sets either ends the scan with Rejected or turns EmptyLine into Method, and no scan starts in either."
argument = "Within a call: only the EmptyLineLf arm sets `scan` to EmptyLine, and the arms that refuse a byte set Broken. After the match, Broken always ends the loop (`if scan is Broken { result = Rejected(400); break }`); EmptyLine either ends it at the size and count check (Rejected(431)), or reaches `if scan is EmptyLine { start = at; scan = Method }` before the next pass. So no pass after the first starts in EmptyLine or Broken, and scan_head saves either in `self.scan` only when it returns Rejected. Across calls: `self.scan` is written by Parser::Parser (Method), by Parser::next once a head is parsed (Method), and at scan_head's end. Parser::next is scan_head's one caller (the white-box reference parser has a scan of its own); on Rejected it sets `self.invalid`, and from then on next returns Invalid at its first line (`if self.invalid is Some(status)`), before it reaches scan_head. So no call starts in EmptyLine or Broken, and the first pass does not either."
reviewer = ""

[[exclusion]]
file = "http1/parser.mbt"
definition = "Section::after"
position = "29:23"
text = "f5f8e91c88180b89"
category = "UNREACHABLE"
reason = "The arm for a section that has Ended or is Broken (`Ended | Broken => Broken`), which no caller passes: Parser::scan_head and Chunks::decode, its only callers, stop at either."
argument = "Section is private to http1, and after has two callers (the white-box reference parser has a section of its own). (1) Parser::scan_head's Fields arm, `section = before.after(c)`. `scan` becomes Fields only in the VersionLf arm, which sets `section = FieldStart` with it. After the call, a Broken section sets `scan = Broken`, which ends the loop with Rejected(400); an Ended section ends it at the size and count check (Rejected(431)) or at `if section is Ended { result = Ended(at); break }`; the runs of a name's or a value's bytes after it change only `at`. So no pass in Fields starts with an Ended or Broken section, and scan_head saves Fields with an Ended section only when it returns Ended or Rejected (a Broken section saves the scan Broken). On Rejected, and on Ended when parse_head fails, Parser::next sets `self.invalid` and never calls scan_head again (`if self.invalid is Some(status)` comes first); on Ended with a parsed head, next sets `self.scan = Method`, so the next head reaches Fields again only through VersionLf, which sets FieldStart. (2) Chunks::decode's Trailer arm, `match section.after(c)`: its arms return on Ended and on Broken, so the state Trailer holds only FieldStart (set by SizeLf) or a section after returned that is neither. So no call passes Ended or Broken."
reviewer = ""
