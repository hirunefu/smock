# xml's select.mbt (#414, part 5 of 6 of xml's triage for #325): survivors
# of the first weekly run (44423781036) that no input can tell from the
# code, and one capacity hint. Each argument is in its reason; the two of
# element_at rest on next_node's contract (a node that the path selects),
# and say so. The compiler's output differs for each. The implementer also
# compared a digest of all that the walking API answers on 6,000 random
# documents (14,064 nodes on 20 paths: each value, whether utf8_value gives
# a view of the input, value_is for 13 texts) with each mutant applied by
# hand and without it: the same for each, while three mutants that are not
# equivalent changed it (a scratch test, not committed). A separate agent
# context, which wrote neither these entries nor xml's tests, then tried to
# kill each from the spec, and `adversarial` records what it tried; it
# tried the capacity hint too, which has no such field: the values are the
# same bytes with it, and core's Buffer takes a hint below 1 as 1. Through
# xml's public interface no input tells any of them from the code.
# element_at's `low = 1` does differ outside next_node's contract, and in a
# white-box call of the private element_at, as its entry says. The
# maintainer reads every entry, since xml is a protocol package.
