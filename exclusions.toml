e in text and in an attribute value, a comment, a processing instruction's target and data, CDATA, the XML declaration's version and encoding, before and after the root element, an end tag's name, and cut off at the input's end), and 12 documents with colons in their names: 499,962 documents, each parsed and, when it parses, read with select, first_node, next_node, utf8_value and value_is on four paths, the outcomes hashed against the unchanged code's. It and xml's 48 tests pass with the mutant (49 of 49); it fails alone with decode's last -1 made 0, `c1 >= 1`, `c3 >= 1`, `b0 >= 0xE1` and local_start's `colon < 3`", "the sources read for an input whose documented result the mutant changes: XML 1.0 §2.2 and §2.3, RFC 3629 §3 and §4, the README's Documents (\"Bytes that are not well-formed UTF-8 are an error\") and matching.md's XML bodies (a body that is not XML fails every xml condition; the engine reads neither the error's position nor its message). The error is the same: Parser::char and Parser::skip_name raise it at the sequence's first byte, and Parser::reference at the `&`, whatever negative number decode gives"] }
