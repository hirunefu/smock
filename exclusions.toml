# http1/chunked.mbt and http1/date.mbt (#405, part 1 of 5 of http1's
# triage for #324): survivors of the first weekly run (44423781036) that no
# input can tell from the code, and one capacity hint. Each argument is in
# its reason. The compiler's output differs for each. The implementer also
# compared digests of what the parser takes out of 3,000 random chunked
# streams (two chunked requests and a GET on one parser; chunk sizes in
# either case, with leading zeros, empty or not hexadecimal; extensions,
# trailer fields and broken line ends; body limits from 0 to 2^31 - 2), each
# fed whole, a byte at a time, in random pieces, split at every byte (the
# first 300), with the first body's last byte at the start of a long piece,
# and a byte at a time after a GET whose target is 1 to 600 bytes long,
# with each mutant applied by hand and without it: the same digests for
# each, while five variants that are not equivalent changed them (a scratch
# test, not committed). take_body's `self.size = 0` decided nothing: `size`
# is 0 already when take_body runs, and SizeStart writes it before any state
# reads it. The maintainer approved its deletion on 2026-11-21 (the
# twenty-second round), so the statement is gone, and its two survivors'
# entries with it.
# A separate agent context, which wrote neither these entries nor http1's
# tests, then tried to kill each from the specs and smock's documents, and
# `adversarial` records what it tried. It tried the capacity hint too,
# which has no such field: core's StringBuilder takes any hint of 0 or
# more, grows as it is written, and `to_string` copies only what was
# written, so the Date values are the same with 30 (46,338 values by hand,
# those of 30 to 32 characters for years past 9999 included). Through
# http1's public interface no input tells any of them from the code; a
# white-box read of the private field `size` sees the value of
# Chunks::Chunks, as its reason says. The maintainer reads
# every entry, since http1 is a protocol package.

[[exclusion]]
mutant = "http1/chunked.mbt,Chunks::Chunks,INT,0,1,0"
text = "a339ed29a5a24855"
category = "EQUIVALENT"
reason = "A new decoder's `size` starts at 1 instead of 0. A new decoder is in the state SizeStart, and Chunks::decode reads `size` only in the states after it: SizeStart sets `size` to the chunk size's first digit, or answers 400 without reading it, before any other state runs. take_body returns the decoder to SizeStart too. So the starting value is never read, and every input gives the same requests and the same errors. Only a white-box read of the private field sees the 1, from the decoder's making until a chunk size's first digit is decoded (a first byte that is no digit gets 400 and leaves it there); no caller of the package can make one."
