mutant = "http1/parser.mbt,Parser::scan_head,AOR,+,-,1"
text = "7ed4adc092ef4781"
category = "EQUIVALENT"
reason = "`stop` becomes `start - size_limit` instead of `start + size_limit` when the bytes after `start` are the header size limit or more: `stop` is then below `at`, so the word loops' `stop - at` is negative, unless it wraps (below), and the byte loops' `at < stop` is false, and none of the shortcuts (a field value's eight bytes at a time and one at a time, a field name's, a target's two) takes a byte. The head scan's shortcuts take a run of bytes that leaves the scan where it is (its doc comment), and only up to `stop`, at most `end` and at most the header size limit past `start`, so that the byte past the limit is checked as it would be alone. The outer loop runs the same state machine on each byte, one at a time, with the size check after each: for each byte of a field value that is_field_value_byte takes and that is not a CR, Section::after keeps the section at FieldValue, and the line ends, the field count and the result stay as they are. A field name's bytes keep it at FieldName, and a target's bytes after its first keep the scan at Target, which counts nothing since #433. So the scan ends in the same state with the same result for every input a test can hold. Natively it then reads no word, and otherwise the code's, so nothing it does is undefined. Where it does differ: the word loops' `stop - at` is then `start - size_limit - at`, which passes -2^31 and wraps to a large positive number when the header size limit and the bytes the scan has taken after `start` add up to more than 2^31. That needs a header size limit over 2^30 and more than 2^30 bytes held after `start`, about 1 GiB, which no test may allocate; smock cannot reach it, since its limits are at most 2^30, where the sum is at most 2^31 and `stop - at` is at least -2^31. There the word loops take words past `stop` while no byte in them stops the run, past the header size limit and even past `end`, over bytes left from before a move, or past the array: the mutant can then need more where the code gives 431, or read out of bounds. Before #435 the loops tested `at + 8 <= stop`, which a negative `stop` made false while `at + 8` did not wrap, so this mutant read no word there."
compiler_output = "differs"
