reason = "A capacity hint: the parser's first buffer has 4,097 bytes instead of 4,096. feed grows the buffer, or moves the bytes it holds to the front, whenever the bytes fed do not fit after those it holds, and every reader of the buffer reads only from `start` to `end`, so the requests and statuses are the same; only the buffer's length, when it grows, and where the bytes sit change. The wait for a Content-Length body compares the bytes at hand with the length (#433), so it does not depend on where the bytes sit: while #433 was open, `start + length` could pass 2^31 - 1 at one place and not at the other (the twenty-second round's reader found an input), and with the fix that input needs more with this mutant applied by hand, as with the code. Since #435 the head scan's word loops read a word only when `stop - at >= 8`, with `at` at most `stop`, which cannot wrap, so no reader depends on where the bytes sit, in a buffer of any length."
