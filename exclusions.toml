[[exclusion]]
mutant = "http1/parser.mbt,Parser::scan_head,IFC,section is FieldValue,false,0"
text = "7ed4adc092ef4781"
category = "EQUIVALENT"
reason = "The shortcut over a field value's bytes is never taken: `if section is FieldValue` becomes `if false`, and the `else if` after it tests FieldName, which the section is not then. The head scan's shortcuts take a run of bytes that leaves the scan where it is (its doc comment), and only up to `stop`, at most `end` and at most the header size limit past `start`, so that the byte past the limit is checked as it would be alone. The outer loop runs the same state machine on each byte, one at a time, with the size check after each: for each byte of a field value that is_field_value_byte takes and that is not a CR, Section::after keeps the section at FieldValue, and the line ends, the field count and the result stay as they are. So the scan ends in the same state with the same result for every input; only its speed changes. Natively it reads no word of a field value, and a target's as the code does. The shortcut is there for speed, since field values are most of a head (the head scan's doc comment), which no test reads; by what the code is for (the nineteenth round), it stays, as xml's Parser::unique's bound did."
compiler_output = "differs"
