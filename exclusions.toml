reason = "The loop over a target's bytes one at a time, after the loop over eight at a time, is never taken: the bytes it would take go through the outer loop instead. The head scan's shortcuts take a run of bytes that leaves the scan where it is (its doc comment), and only up to `stop`, at most `end` and at most the header size limit past `start`, so that the byte past the limit is checked as it would be alone. The outer loop runs the same state machine on each byte, one at a time, with the size check after each: each byte that is_visible_byte takes keeps the scan in Target, where the shortcut leaves it; the scan counts nothing there since #433. So the scan ends in the same state with the same result for every input; only its speed changes. Natively each word the word loop reads lies before `stop`, at most `end`, as the code's do, though at other places in a run (after each byte the outer loop takes), so nothing is read past the bytes fed. The loop is there for speed, which no test reads; by what the code is for (the nineteenth round), it stays, as xml's Parser::unique's bound and #406's field-value shortcut did."
