adversarial = { context = "#328's adversarial step, 2026-11-20: a separate agent context that wrote none of #328's tests or entries", tests = ["value_end of the start find gives, and the repeat search from its end as engine's has_cookie makes it: a= (2), \"a= \" (2), \"a=  ;b=1\" (2), = for the empty name (1), \" = \" (2), a= and a tab (2), \"a= x ;\" (4), a=x (3), \"b=1; a= \" with a tab and a space (7)", "passed with the mutant applied by hand, on wasm-gc; outside the contract the mutant differs, as the reason says: value_end(\" \", 1) gives 0 instead of 1, and value_end(\"  \", 0) stops on an access out of bounds instead of giving 0, but find never gives such a start"] }
