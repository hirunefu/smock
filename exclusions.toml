[[exclusion]]
mutant = "grpc/framing.mbt,Deframer::Deframer,INT,0,1,1"
text = "46faf196ebac120c"
category = "EQUIVALENT"
reason = "A new deframer's `length` starts at 1 instead of 0. Only `ending()` reads `length`, in its InMessage arm, when `left > 0`. `left` starts at 0, and only `take` makes it positive, in the step that sets `length` from a whole prefix. So the starting value is never read."
compiler_output = "differs"
adversarial = { context = "a separate agent context of #275's step 3, on 2026-11-20, which wrote neither this entry nor any of grpc's tests", tests = ["a differential in a scratch white-box test of grpc, not committed: a copy of Deframer's take, whole_messages and ending carrying the mutation, fed beside the real Deframer the way server feeds it (each Prefix's rest taken next), the Taken, whole_messages() and ending() compared after every call; bodies of 0 to 3 messages of 0 to 3 octets, each cut short at every octet, and four prefixes announcing 0xFFFFFFFF, 0x80000000, 0x7FFFFFFF and 7 octets with fewer after; pieces cut at every subset of the inner points for bodies of up to 11 octets, else at none, one, two or three points (three up to 17 octets) and at every point; 372,375 runs for each of the three framing mutants and for an unmutated copy, no difference. The same harness reports a difference for a starting `length` that ending() would read before any prefix, and for a room one octet too large", "among them the states where `length` still holds its starting value, before the first prefix is whole: the empty body and every body cut inside its first prefix, where ending() gives Whole(messages=0) or InPrefix and reads no length"] }
reviewer = "the maintainer, 2026-11-21, who read every entry of this protocol package"

[[exclusion]]
mutant = "grpc/framing.mbt,Deframer::take,AOR,-,+,0"
text = "1e98b4b3f0a4c6e1"
category = "EQUIVALENT"
reason = "`room = (n - i)` becomes `(n + i)`, but the branch that takes a message's octets only runs with `i` at 0. `left` is positive when `take` starts only if an earlier call left it so; then that branch is the call's first step. In the same call it never runs again: once the message's last octet is taken, the loop reads prefix octets, and it returns as soon as a prefix is whole, which is the only step that makes `left` positive. With `i` at 0, `n + i` is `n - i`."
compiler_output = "differs"
adversarial = { context = "a separate agent context of #275's step 3, on 2026-11-20, which wrote neither this entry nor any of grpc's tests", tests = ["a differential in a scratch white-box test of grpc, not committed: a copy of Deframer's take, whole_messages and ending carrying the mutation, fed beside the real Deframer the way server feeds it (each Prefix's rest taken next), the Taken, whole_messages() and ending() compared after every call; bodies of 0 to 3 messages of 0 to 3 octets, each cut short at every octet, and four prefixes announcing 0xFFFFFFFF, 0x80000000, 0x7FFFFFFF and 7 octets with fewer after; pieces cut at every subset of the inner points for bodies of up to 11 octets, else at none, one, two or three points (three up to 17 octets) and at every point; 372,375 runs for each of the three framing mutants and for an unmutated copy, no difference. The same harness reports a difference for a starting `length` that ending() would read before any prefix, and for a room one octet too large", "among them pieces that hold a message's last octets and the next prefix, where the loop goes on with `i` past 0 and the branch does not run again, pieces that end before or at a message's last octet, and announced lengths larger than any piece"] }
reviewer = "the maintainer, 2026-11-21, who read every entry of this protocol package"

