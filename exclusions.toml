# http1/parser.mbt (#406, part 2 of 5 of http1's triage for #324): survivors
# of the first weekly run (44423781036) in Parser::Parser, Parser::feed and
# the first part of Parser::scan_head that no input can tell from the code,
# and one capacity hint. Each argument is in its reason. The compiler's
# output differs for each. Two move a boundary of the body limit's clamp
# to where both arms give the same limit. Three in feed change at most
# where the bytes held sit in the buffer, or in which array, past what any
# reader reads. Seven change only how scan_head takes a run of a field
# value's bytes (the loops over eight bytes and one byte at a time, and
# their bound `stop`), which the outer loop takes the same way, one byte at
# a time. Four leave out a whole piece of code (feed's reuse of its buffer,
# the field value's shortcut, and each of its two loops) that is there only
# for speed or allocation: by what the code is for (the nineteenth round's
# rule), they are EQUIVALENT, as xml's Parser::unique's bound was, and no
# deletion is proposed. scan_head reads words unchecked
# (unsafe_read_uint64_le), so its verdicts are native: none of its seven
# reads past `stop`, at most `end`. The implementer also compared a digest
# of every answer of the parser on 2,500 random streams fed in random pieces
# with random limits, with each mutant applied by hand and without it: the
# same for each, on wasm-gc and, for scan_head's, natively, while four
# variants that are not equivalent changed it or trapped (a scratch test,
# not committed). A separate agent context, which wrote neither these
# entries nor http1's tests, then tried to kill each from the spec (RFC 9112,
# RFC 9110, docs/running.md and Parser's doc comments) and could not, and
# `adversarial` records what it tried. It ran the ARID entry, which has no
# `adversarial`, the same way: in its copy and applied by hand, every answer
# and state is the code's, and only where the bytes sit differs, in every
# run. It corrected the native sentence of four reasons: the loops' mutants
# read fewer words, or words at other places in a run, never past `stop`.
# None differs from the code at http1's public interface; feed's `<=` and
# its new array differ only in where the bytes held sit (`start`, `end`, the
# bytes past `end` and the array), which is private. The maintainer reads
# every entry, since http1 is a protocol package.

[[exclusion]]
mutant = "http1/parser.mbt,Parser::Parser,ROR,<,<=,0"
text = "42d0a450a4c634ee"
category = "EQUIVALENT"
reason = "`body_limit < 0` becomes `body_limit <= 0`: a body limit of 0 then takes the first arm, which gives 0, instead of the last, which gives the limit itself, 0. Every other limit takes the same arm as before, so the parser keeps the same limit for every argument."
compiler_output = "differs"
adversarial = { context = "a separate agent context of #275's step 3, on 2026-11-21, which wrote neither this entry nor any of http1's tests", tests = ["a differential in a scratch white-box test of http1, not committed: copies of Parser::Parser (its clamp of the body limit and its first buffer), feed, next and scan_head, with each of #406's 13 mutations behind a number, run beside the real Parser on the same pieces with the same limits. After each piece it compares every answer of next (each request whole, Continue, NeedMore and the status) and in_request, and the state without where the bytes sit (the bytes held, the head scan's state, count, section, field count and line ends, the chunk decoder's state and the body limit); where they sit (start, end and the buffer's length) is compared apart. Five corpora: (1) 2,754 heads, each with a run of 0 to 17 bytes, a separator and a run of 0, 1, 7, 8, 9, 16 or 17 bytes in a field value (the separator none, tab, space, DEL, 0x80, NUL, 0x1F, CR, LF or CR LF), in a target or in a field name (seven or eight separators of their own), then a second request, at every header size limit from 1 to two past the head, fed whole and one byte at a time, and cut in two at every byte at seven limits around the separator and the head's end: 1,184,139 runs; (2) empty lines, then heads with a field of 3,000 bytes and requests after, cut at every byte after the empty lines and, when longer, again at the 4,096th, where the second piece ends with the buffer: 38,061 runs; (3) a request with a body of about 4,000 bytes, then a head of 30 to 64 bytes cut at every pair of its bytes, so that the second piece makes the parser move what it holds and leaves the body's bytes past `end`, at five limits: 372,870 runs; (4) bodies of 0 to 2 bytes framed by Content-Length and chunked, with and without Expect: 100-continue, and sizes of 2^31 - 2 and 2^31 - 1, at ten body limits from -2^31 to 2^31 - 1, whole and one byte at a time: 240 runs; (5) random streams of requests with long targets, names, values and bodies and a stray byte now and then, in random pieces of up to 1 to 20,000 bytes, with random limits: 1,500 on wasm-gc (985 over 4 KiB), 300 natively. The copy without a mutation equals the real parser in every answer, state and place, on wasm-gc and natively (arm64). The same harness catches eleven variants that are not equivalent: the body limit clamped below -1 or at 1; the first byte held spoilt on a move (any move, one where the room was exact, one within the same array); `stop` one byte past the header size limit, or one stale byte past `end`; the word loop's bound one byte past the limit; the byte loop taking any byte but CR; and has_control without DEL", "the clamp alone: the copy with the mutation against the code's on all 2^32 Int32 limits, on wasm-gc and natively: none differs, while `< -1` and `<= 1` differ at -1 and at 1 alone; the copy of the code against the real constructor's limit at 40,010 limits: the same. Read: the constructor's doc comment (a negative limit is taken as 0, so that only an empty body fits), docs/running.md (`--body-limit` from 0 to 2^30: longer bodies get 413), RFC 9110 §15.5.14 and RFC 9112 §6 and §7.1 for corpus 4's framing; a limit of 0 is 0 whichever arm gives it, so no body, framing or limit can tell the two apart", "the mutant applied by hand to http1/parser.mbt in the worktree (the change made, the tests run, the file restored): http1's 111 tests pass, and the harness, which then compares the real, mutated parser with the copy of the code on the five corpora (the random one at 300 streams), finds no answer or state that differs, on wasm-gc. Four real variants applied the same way are caught: scan_head's `end - start < size_limit` made false (killed by #406's split test) and the byte loop's `at <= stop` (each fails limits_test's split test, and the harness traps on them), feed's `dst_offset=1` (fails the test of a large body in many pieces, and the harness differs in 102,509 runs) and the byte loop taking any byte but CR (fails six of http1's tests)"] }
