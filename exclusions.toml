# xml/parser.mbt's equivalent mutants (#412, the third of the six triage
# tickets of xml's survivors for #325): 15 of the 23 survivors of the first
# weekly run (44423781036) in xml/parser.mbt, which no input to xml's
# public interface can tell from the code; tests kill the other 8. The
# compiler's output differs for each. Four change Parser::unique's tests
# of `first`, which is never 0, and of two attributes' starts, which are
# never equal. Two change Parser::reference's test of predefined_entity's
# result at 0, and two Parser::skip_name's test of decode's, at 0, which
# neither function ever returns. One moves the cap at which a character
# reference's number stops growing, past U+10FFFF either way. Four change
# Parser::qualified_name's tests of a colon's index at 0, where no name
# starts. Two drop line_end's step past the line feed of a CR LF, which
# each loop that calls it then reads as a character it allows. None of
# them is deleted as redundant code: the step reads a CR LF as the one
# line end XML 1.0 §2.11 makes of it, as line_end's doc comment says, as
# the steps in #411's block above say where a construct's content starts.
# The separate context that tries to kill each from the spec comes after
# the implementer who wrote these entries, and fills in `adversarial`;
# until then it says so. The maintainer reads every entry, since xml is a
# protocol package.

