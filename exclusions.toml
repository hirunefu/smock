text = "223a6dec7954c5ec"
category = "EQUIVALENT"
reason = "`if self.peek() == '\\n'` becomes `if false`, so line_end steps past the CR of a CR LF and leaves the line feed. Its three callers are loops that read the next byte at once: Parser::root (content), Parser::cdata and Parser::attribute_value. In each, a line feed is not markup (not `<`, `&`, a quote, a `]` of `]]>` or a CR) and takes the arm for other characters, which reads it with Parser::char as U+000A, a character XML allows (§2.2 [2]), and keeps nothing of it. So parsing reaches the byte after the CR LF in the same state, and keeps the same name starts and depths, or raises the same error. Selection reads line ends from the input itself (select.mbt, line_char)."
