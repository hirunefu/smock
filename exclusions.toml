# The exclusion list (CONTRIBUTING.md, "Exclusions"; #302): the one list
# that accepts a surviving mutant or an uncovered point. No attribute in
# the source excludes anything. scripts/mutation/exclusions.py reads it,
# and `exclusions.py check`, in CI's job checks, checks each entry; the
# coverage report, the coverage floors and the mutation runner count after
# it. `exclusions.py new <file>:<line>:<column>` or `new <mutant id>`
# prints a new entry's stanza.
#
# Each entry names a mutant by its id (mutant), or a point by its file,
# its definition and its position in the definition (its line, counted
# from the definition's first line, and its column), and gives its
# definition's text when it was made (text), a category of ADR 0006, a
# reason and the reviewer. An entry whose definition's text changed is
# stale: it accepts nothing until it is triaged again.
#
# Which entries the maintainer reads: every entry in the protocol
# packages (http1, grpc, yaml, re2, xml and protobuf) and in
# serverparsers, and one in five of the others, drawn once the batch is
# frozen (the branch's last push) with a seed that no agent can know
# before, so that its author cannot know which: the run ID that GitHub
# Actions gives the packages run of the bulk workflow on the frozen tip.
# `exclusions.py review --seed <run ID>` lists them. If a sampled entry
# is rejected, its author triages the whole batch again, and a new sample
# is drawn with the ID of the packages run on the new frozen tip. Only
# the maintainer fills in the reviewer, in a commit the maintainer makes
# or acknowledges at the merge; the weakening report lists every entry
# whose reviewer changed.

# The first batch: the 28 entries below, all abort arms that an invariant
# guards. The maintainer read its two entries in the protocol packages
# (protobuf and yaml) and six of the other 26, drawn with the seed
# 20261118 once the batch was frozen, and accepted the batch on 2026-11-18
# (#302).

