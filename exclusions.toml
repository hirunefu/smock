ort, `:80` and an empty one, is_authority_form with and without `:443`, and is_request_target for CONNECT and for GET (17,493,868 calls); is_ip_future on every string of up to four of 23 symbols (v, V, 0, 9, a, f, F, g, G, `.`, `:`, `-`, `_`, `~`, `!`, `$`, `@`, `/`, `%`, space, U+00E9, U+1F600 and a lone low surrogate), on `v` with up to six and `V` with up to five of 12 (v, 0, f, F, g, `.`, `:`, `-`, `~`, `!`, `@` and a lone high surrogate), and with every code unit in the version, just before the `.`, just after it, at the end and in place of the `v` (4,149,131 calls), each also in brackets through is_host_value with and without a port, is_authority_form and is_request_target for CONNECT (16,596,524 calls); and the parser on 3,290 IP literals in brackets or cut before the `]` (also with UTF-8, a stray 0xFF, DEL and 0x80), each as a Host field, as a Host with a port and as a CONNECT's target (9,870 answers). On the code, no mutated copy differs from the real function on any input, nor do the copies with `c >= 0x121`, the length check left out, `host.length() >= 4`, or the address checked from 0 or from `dot - 2`; the controls `c >= 0x7e` (127 inputs differ), `c >= 0x122` (131), `host.length() >= 5` (4, `[::]` among them), `s[dot + 2:]` (75,866) and the address checked from `dot - 1` with the version checked only up to `dot - 1` (103,842) are each caught", "the mutant applied by hand to http1/target.mbt in the worktree (the change made, the tests run, the file restored): http1's 113 tests pass, the real (mutated) functions equal the copies of the code on every input above, and every digest of the scratch test is the code's, on wasm-gc and natively (arm64, for information: no definition of target.mbt uses an unchecked access, so wasm-gc decides). Variants of the bound applied the same way are caught: `c >= 0x7e` fails checks_test.mbt's visible-ASCII test (`~` refused) and `c >= 0x122` its test of characters beyond ASCII (U+0121, whose low byte is `!`), and each changes the digest; the copy with `c >= 0x121` agrees everywhere, as the band from 0x7F to 0x121 says"] }
