# http1/target.mbt (#409, part 5 of 5 of http1's triage for #324): survivors
# of the first weekly run (44423781036) in the checks of a request target
# and of a Host value that no input can tell from the code. Each argument is
# in its reason; the compiler's output differs for each. None of these
# definitions uses an unchecked access, so wasm-gc decides. Three move
# is_visible_ascii's bound for code units beyond ASCII within the band where
# the byte check after it refuses the same code units (0x7F to 0x121). Three
# more changed is_uri_host's `host.length() >= 2`, which decided nothing: a
# host that begins with `[` and ends with `]` has two characters at least.
# The maintainer approved the check's deletion on 2026-11-21 (the
# twenty-second round), so it is gone, and its three entries with it. Two
# start is_ip_future's check of an address at
# the version's last digit or at the `.`, which that check takes too. None
# differs anywhere, a white-box call of the private functions included. The
# implementer compared digests of is_visible_ascii on every code point, of
# is_uri_host, is_ip_future and is_ipv6 on every short string over the
# characters of IP literals, of is_host_value, is_authority_form and
# is_request_target on IP literals with and without a port, and of the
# parser on Host fields and CONNECT targets, with each mutant applied by
# hand and without it: the same for each, on wasm-gc, while variants that
# are not equivalent changed them (a scratch test, not committed). The
# adversarial attempt, by a separate agent context that wrote neither these
# entries nor any of http1's tests, killed none: copies of the three
# definitions with each mutation equal the real ones on every code unit
# (is_visible_ascii), on `[` alone and `[` with every code unit (the whole
# domain where is_uri_host's bound acts) and on millions of short strings,
# and with each mutant applied by hand http1's tests pass and the digests
# of the three, of the public checks and of the parser are the code's, on
# wasm-gc and natively; five variants that are not equivalent are caught.
# It corrected one clause of is_visible_ascii's three reasons: the parser
# does not call it (its head scan checks each byte with is_visible_byte);
# HTTP/2's check of `:path` does. The maintainer reads every entry, since
# http1 is a protocol package.

