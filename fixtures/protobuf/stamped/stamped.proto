// Written for smock's tests: a method whose input type has fields of a
// well-known type, singular, repeated and as map values, which gRPC Stubs
// do not serve yet.
syntax = "proto3";

package stamped;

import "google/protobuf/timestamp.proto";

service Clock {
  rpc Stamp (Stamped) returns (Ack);
}

message Stamped {
  google.protobuf.Timestamp at = 1;
  repeated google.protobuf.Timestamp history = 2;
  map<string, google.protobuf.Timestamp> by_name = 3;
}

message Ack {
  bool ok = 1;
}
